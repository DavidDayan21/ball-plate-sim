# Builds the packages of SAPIR on the machines of GitHub, then checks them (app/self_check.py).
# By hand (tab Actions, Build, Run workflow): the files, under Artifacts at the bottom of the run, are kept 3 days:
#   SAPIR-Windows: SAPIR.exe, a single file, and THIRD-PARTY-LICENSES.txt;
#   SAPIR-macOS: SAPIR.dmg, for the Macs with Apple Silicon (the licenses inside, next to the app).
# On a tag v<version> pushed (git tag v1.0.0, git push origin v1.0.0): the same, then a draft release of that version
# with SAPIR.exe, SAPIR.dmg and THIRD-PARTY-LICENSES.txt; it is published by hand on GitHub (Releases).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false                          # one system failing does not stop the other
      matrix:
        os: [windows-latest, macos-latest]      # macos-latest: Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: The tag is the version of the software
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(python -c "from app import VERSION; print(VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but the version in app/__init__.py is $version"
            exit 1
          fi

      - name: Install
        run: python -m pip install -r requirements-build.txt

      - name: Build
        run: python -m PyInstaller --noconfirm release/sapir.spec

      # Exit code of the check: 0 passed; 2 passed but the 3D could not be drawn on this machine (no usable OpenGL),
      # a warning; anything else, the build fails. The time includes the unpacking of the exe.
      - name: Check the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $arguments = "--self-check", "$PWD\self-check.txt"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath dist\SAPIR.exe -ArgumentList $arguments -Wait -PassThru
          $watch.Stop()
          if (Test-Path self-check.txt) { Get-Content self-check.txt -Encoding utf8 }
          else { "No report: SAPIR.exe did not start" }
          $code = $process.ExitCode
          "Exit code $code, $([math]::Round($watch.Elapsed.TotalSeconds, 1)) s"
          if ($code -eq 2) { "::warning::The 3D could not be drawn here (no usable OpenGL); the rest passed" }
          elseif ($code -ne 0) { exit 1 }
          exit 0

      - name: Check the package (Mac)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          SECONDS=0
          code=0
          dist/SAPIR.app/Contents/MacOS/SAPIR --self-check "$PWD/self-check.txt" || code=$?
          echo "Exit code $code, $SECONDS s"
          [ -f self-check.txt ] || echo "No report: SAPIR did not start"
          if [ "$code" -eq 2 ]; then
            echo "::warning::The 3D could not be drawn here (no usable OpenGL); the rest passed"
            exit 0
          fi
          exit "$code"

      - name: Disk image (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir dmg
          ditto dist/SAPIR.app dmg/SAPIR.app
          ln -s /Applications dmg/Applications          # in the window of the disk: drag SAPIR onto Applications
          cp dist/THIRD-PARTY-LICENSES.txt dmg/
          for attempt in 1 2 3; do                       # hdiutil sometimes finds the disk busy
            hdiutil create -volname SAPIR -srcfolder dmg -ov -format UDZO dist/SAPIR.dmg && break
            sleep 10
          done
          test -f dist/SAPIR.dmg

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: SAPIR-Windows
          path: |
            dist/SAPIR.exe
            dist/THIRD-PARTY-LICENSES.txt
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: SAPIR-macOS
          path: dist/SAPIR.dmg
          retention-days: 3
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build                                # both packages built and checked
    runs-on: ubuntu-latest
    permissions:
      contents: write                           # to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            Windows 10 or 11: SAPIR.exe. Mac with Apple Silicon: SAPIR.dmg. The packages are not signed: how to
            open them the first time is explained in the README (Download and install).
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "SAPIR $GITHUB_REF_NAME" --notes "$NOTES" \
            files/SAPIR.exe files/SAPIR.dmg files/THIRD-PARTY-LICENSES.txt
